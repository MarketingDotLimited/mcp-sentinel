name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Verify reproducible release bundle
        run: |
          MCP_ALLOW_UNSIGNED_RELEASE=true npm run release:bundle
          first_hash="$(cut -d' ' -f1 dist/mcp-sentinel-*.sha256)"
          MCP_ALLOW_UNSIGNED_RELEASE=true npm run release:bundle
          second_hash="$(cut -d' ' -f1 dist/mcp-sentinel-*.sha256)"
          test "$first_hash" = "$second_hash"
          node -e "const fs=require('fs'); const file=fs.readdirSync('dist').find(name=>name.endsWith('.manifest.json')); const value=JSON.parse(fs.readFileSync('dist/'+file)); if(value.sha256!==process.argv[1] || !/^[a-f0-9]{40}$/.test(value.commit)) process.exit(1)" "$second_hash"
          tar -tzf dist/mcp-sentinel-*.tar.gz | grep -q 'mcp-sentinel-.*\/authelia\/configuration.template.yml'
          if tar -tzf dist/mcp-sentinel-*.tar.gz | grep -Eq 'authelia\/(configuration|users|user-mappings)\.(yml|json)|oidc_.*\.pem|\.sqlite3?$'; then
            echo 'Release archive contains runtime state or credentials.' >&2
            exit 1
          fi

      - name: Check for secrets in code
        run: |
          if grep -rniE "password\s*=\s*['\"].+" --exclude-dir=node_modules .; then
            echo "❌ Possible hardcoded password found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type library > sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: sbom.cdx.json

  test-suite:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Test Integrity Audit
        run: npm run test:integrity

      - name: Verify User Needs
        run: npm run test:user-needs

      - name: Verify Coverage Scope
        run: node scripts/verify-coverage-scope.mjs

      - name: Run Test Suites (Node)
        run: npm run test:coverage:node

      - name: Run Privileged Tests
        run: sudo env "PATH=$PATH" c8 --clean=false npm run test:privileged

      - name: Fix Coverage Permissions
        run: sudo chown -R $USER:$USER coverage/ || true

      - name: Run Browser Tests
        run: npm run test:browser

      - name: Generate Node Coverage Report
        run: npm run test:coverage:node:report

      - name: Merge Coverage
        run: npm run test:coverage:merge

      - name: Verify Coverage Thresholds
        run: npm run test:coverage:verify

      - name: Run Mutation Testing
        run: npm run test:mutation

      - name: Upload Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Setup Go for Gitleaks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.24.11

      - name: Build pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1

      - name: Scan all Git history for secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1

      - name: Reject historical runtime-state paths
        run: |
          if git log --all --name-only --pretty=format: | sort -u | grep -E '(^|/)(keys\.json|coverage/|data/|certs/|logs/|authelia/(configuration\.yml|users\.yml|user-mappings\.json|db\.sqlite3|notification\.txt|oidc_.*\.pem|backups/))'; then
            echo 'Historical runtime-state paths are still reachable from a Git ref.' >&2
            exit 1
          fi

      - name: Verify secrets with TruffleHog
        uses: trufflesecurity/trufflehog@a2ef4f51a5e3644c500f02650db88504cd7d9b68 # main, pinned 2026-07-23
        with:
          extra_args: --only-verified

      - name: Verify required files exist
        run: |
          for f in LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md .env.example; do
            [ -f "$f" ] || (echo "❌ Missing: $f" && exit 1)
          done
          echo "✅ All required files present"
